services:
  postgres:
    image: postgres:16
    container_name: chess-postgres
    environment:
      POSTGRES_DB: ${DATA_BASE_NAME}
      POSTGRES_USER: ${DATA_BASE_USER}
      POSTGRES_PASSWORD: ${DATA_BASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - chess-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chess-redis
    ports:
      - "6379:6379"

volumes:
  chess-postgres-data:
